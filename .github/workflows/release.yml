name: Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MSRV: "1.81.0"

jobs:
  test:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt --no-self-update
          rustup default stable
          rustup target add wasm32v1-none --toolchain stable
          rustup toolchain install "${MSRV}" --profile minimal --no-self-update
          rustc -V
          cargo -V

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml version
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"

          if [ -z "${package_version}" ]; then
            echo "Could not read package version from Cargo.toml" >&2
            exit 1
          fi

          if [ "${GITHUB_REF}" != "refs/tags/${package_version}" ]; then
            echo "Ref ${GITHUB_REF} does not match Cargo.toml version ${package_version}." >&2
            echo "Create and push tag ${package_version}, then run this workflow from that tag." >&2
            exit 1
          fi

      - name: Prefetch dependencies
        run: |
          cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy  --offline --all-targets --all-features -- -D warnings -D clippy::pedantic

      - name: Run tests
        run: cargo test  --offline --features test-equality

      - name: Run tests with extended details
        run: cargo test --offline --features extended_details,test-equality

      - name: Run tests with debug_prints
        run: cargo test --offline --features debug_prints,extended_details,test-equality

      - name: Run no-default-features library tests
        run: cargo test  --offline --lib --no-default-features --features test-equality

      - name: Run tests without parser comments
        run: cargo test  --offline --no-default-features --features std,error_messages,test-equality

      - name: Run extended tests without parser comments
        run: cargo test --offline --no-default-features --features std,error_messages,extended_details,test-equality

      - name: Check default consumer API
        run: cargo test --offline --manifest-path tests/api-contract/Cargo.toml --locked

      - name: Check opt-in consumer equality
        run: cargo test --offline --manifest-path tests/api-contract/Cargo.toml --locked --features test-equality

      - name: Check extended consumer API
        run: cargo test --offline --manifest-path tests/api-contract/Cargo.toml --locked --features extended_details

      - name: Check extended consumer equality
        run: cargo test --offline --manifest-path tests/api-contract/Cargo.toml --locked --features extended_details,test-equality

      - name: Check no_std target
        run: cargo check  --offline --lib --no-default-features --target wasm32v1-none

      - name: Check parser comments on no_std target
        run: cargo check  --offline --lib --no-default-features --features comments --target wasm32v1-none

      - name: Check extended details on no_std target
        run: cargo check --offline --lib --no-default-features --features extended_details --target wasm32v1-none

      - name: Check all metadata on no_std target
        run: cargo check --offline --lib --no-default-features --features comments,extended_details --target wasm32v1-none

      - name: Check MSRV
        run: cargo +"${MSRV}" check --lib --all-features --locked

      - name: Verify crate packaging
        run: cargo publish  --dry-run

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: test
    environment: publish

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -V
          cargo -V

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish 
